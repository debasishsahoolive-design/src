<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="100%" height="100%">
  <!-- Background Definition -->
  <rect width="1000" height="320" fill="#ffffff"/>
  
  <!-- Outer Wrapper Frame Border -->
  <rect x="5" y="5" width="990" height="310" fill="none" stroke="#000000" stroke-width="2"/>

  <!-- ================= LEFT DIAGRAM: TRACK VISUALIZATION ================= -->
  <g transform="translate(10, 0)">
    <!-- Outer Dark Gray Shaded Ellipse Surface Base -->
    <ellipse cx="230" cy="160" rx="225" ry="110" fill="#8b8c8d" />

    <!-- Light Gray Horizontal Center Rectangle Region -->
    <rect x="95" y="70" width="270" height="180" fill="#c6c8c9" />
    
    <!-- Top Dark Gray Accent Rectangular Segment Box -->
    <rect x="115" y="70" width="210" height="40" fill="#606264" />
    <polygon points="115,70 135,58 325,58 325,70" fill="#606264" />
    
    <!-- Inner White Solid Oval Circuit Line Boundary -->
    <rect x="95" y="70" width="270" height="180" rx="90" ry="90" fill="none" stroke="#ffffff" stroke-width="4" />

    <!-- Thin White Vertical Accent Alignment Indicator Bar -->
    <line x1="165" y1="50" x2="165" y2="265" stroke="#ffffff" stroke-width="3" />
    
    <!-- Horizontal Dimension Track Offset Arrow Segment Line -->
    <line x1="410" y1="160" x2="455" y2="160" stroke="#000000" stroke-width="2" />
    <polygon points="413,156 405,160 413,164" fill="#000000" />
    <polygon points="452,156 460,160 452,164" fill="#000000" />
    
    <!-- Track Width Metric Value Label Designation -->
    <text x="432" y="185" font-family="'Times New Roman', Times, serif, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#000000">3 m</text>
  </g>

  <!-- Vertical Dividing Boundary Column Line Splitter -->
  <line x1="490" y1="5" x2="490" y2="315" stroke="#000000" stroke-width="1.5" />

  <!-- ================= RIGHT DIAGRAM: MATHEMATICAL GRAPH ================= -->
  <g transform="translate(480, 0)">
    <!-- Main Coordinate Orthogonal Axes Systems Grid Layout -->
    <!-- X-Axis Line Segment -->
    <line x1="20" y1="160" x2="490" y2="160" stroke="#000000" stroke-width="2" />
    <!-- Y-Axis Line Segment -->
    <line x1="255" y1="15" x2="255" y2="305" stroke="#000000" stroke-width="2" />

    <!-- Inner Core Mathematical Trajectory Target Ellipse Curve -->
    <ellipse cx="255" cy="160" rx="165" ry="90" fill="none" stroke="#000000" stroke-width="2.5" />

    <!-- Outer Offsets Boundary Geometric Coordinate Ellipse Line -->
    <ellipse cx="255" cy="160" rx="210" ry="120" fill="none" stroke="#000000" stroke-width="2" />

    <!-- Numeric Coordinate Graph Annotation Markers Labels -->
    <!-- Origin Label O -->
    <text x="264" y="182" font-family="'Times New Roman', Times, serif, sans-serif" font-size="22" fill="#000000">O</text>
    
    <!-- Inner Y Axis Intercept Point Height (3) -->
    <text x="235" y="102" font-family="'Times New Roman', Times, serif, sans-serif" font-size="22" fill="#000000">3</text>
    
    <!-- Inner X Axis Intercept Semi-Major Metric Point (4) -->
    <text x="408" y="184" font-family="'Times New Roman', Times, serif, sans-serif" font-size="22" fill="#000000">4</text>
    
    <!-- Inner/Outer Gap Delta Differential Label Unit Width (3 m) -->
    <text x="444" y="184" font-family="'Times New Roman', Times, serif, sans-serif" font-size="20" fill="#000000">3 m</text>

    <!-- Vector Point Coordinate Cardinal Variable Labels Representation -->
    <!-- Apex Y Endpoint Variable Label Target Vector Q -->
    <text x="262" y="32" font-family="'Times New Roman', Times, serif, sans-serif" font-size="24" fill="#000000">Q</text>
    
    <!-- Outer Horizontal End Axis Limit Point Vector P -->
    <text x="475" y="184" font-family="'Times New Roman', Times, serif, sans-serif" font-size="24" fill="#000000">P</text>
  </g>
</svg>
